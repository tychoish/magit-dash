name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ELISP_CI_GNU_MIRROR: ustc
      ELISP_CI_NONGNU_MIRROR: ustc
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@v0.1.1
        with:
          fail-on-warning: "false"

      - name: Run ERT Tests
        uses: tychoish/elisp-ci@v0.1.1

      - name: Measure Code Coverage
        uses: tychoish/elisp-ci/coverage@v0.1.1
        with:
          report-format: "lcov"
          output-file: "coverage/lcov.info"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
